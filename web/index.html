<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claudebrain</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="conn" class="dot"></span>
    <select id="session-picker" title="choose which session to view">
      <option value="all">all sessions</option>
    </select>
    <span id="stats">claudebrain</span>
  </div>
  <div id="toasts"></div>
  <button id="feed-toggle" title="toggle activity feed">☰</button>
  <div id="feed-panel">
    <div id="feed-header"><span>activity</span><button id="follow-toggle" title="expand incoming actions live">⦿ follow</button></div>
    <div id="feed"></div>
  </div>
  <div id="popover" hidden></div>
  <div id="pin-panel" hidden>
    <div id="pin-header">⌗ pinned</div>
    <ul id="pins"></ul>
  </div>
  <div id="prompt-bar" hidden>
    <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
    <select id="prompt-target" title="which session receives this prompt" hidden></select>
    <button id="prompt-send" title="send prompt to the session's terminal">↵ send</button>
    <span id="prompt-status"></span>
  </div>
  <div id="img-preview" hidden><img alt="" /><div class="cap">click to enlarge</div></div>
  <div id="lightbox" hidden><img alt="" /></div>
  <script src="/app.js"></script>
</body>
</html>
