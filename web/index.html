<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claudebrain</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="conn" class="dot"></span>
    <span id="stats">claudebrain</span>
  </div>
  <button id="feed-toggle" title="toggle activity feed">☰</button>
  <div id="feed-panel">
    <div id="feed-header"><span>activity</span><button id="follow-toggle" title="expand incoming actions live">⦿ follow</button></div>
    <div id="feed"></div>
  </div>
  <div id="popover" hidden></div>
  <div id="img-preview" hidden><img alt="" /><div class="cap">click to enlarge</div></div>
  <div id="lightbox" hidden><img alt="" /></div>
  <script src="/app.js"></script>
</body>
</html>
